name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci instead of install: the lockfile is committed, and this fails the run
      # if package.json and package-lock.json ever disagree.
      - run: npm ci

      # Typecheck and test are separate steps so a type error is not reported as
      # a test failure. `npm run build` re-runs the typecheck via prebuild, so
      # this one is the fast-fail duplicate, not wasted time.
      - name: Typecheck
        run: npm run typecheck

      # No .env and no API_TOKEN here, which is the point: tests/api.test.ts
      # deletes those from its own environment so a developer with a populated
      # .env does not get a different result locally than CI does.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: gametrack-dist
          path: |
            dist/
            dist-server/
          retention-days: 7
